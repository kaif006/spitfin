services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: spitfin
      POSTGRES_PASSWORD: dev-only-change-me
      POSTGRES_DB: spitfin
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spitfin"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  server:
    build: { context: ., dockerfile: Dockerfile.server }
    environment:
      PORT: "8080"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8080/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      retries: 10

  web:
    build: { context: ., dockerfile: Dockerfile.client }
    ports: ["8000:80"]
    depends_on:
      server: { condition: service_healthy }

volumes:
  pgdata:
